version: '3.8'

services:
  contract-generator:
    build: .
    container_name: employee-contract-generator
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    volumes:
      # Optional: mount templates directory if you want to modify templates without rebuilding
      - ./templates:/app/templates:ro
