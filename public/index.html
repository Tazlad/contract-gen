<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Contract Generator - Unique Needs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Unique Needs</h1>
            <h2>Employee Contract Generator</h2>
            <p class="subtitle">Generate employment contracts and letters of offer</p>
        </header>

        <form id="contractForm">
            <section class="form-section">
                <h3>Offer Details</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="OfferDate">Offer Date:</label>
                        <input type="date" id="OfferDate" name="OfferDate" required>
                    </div>
                    <div class="form-group">
                        <label for="ContractDate">Contract Date:</label>
                        <input type="date" id="ContractDate" name="ContractDate" required>
                    </div>
                    <div class="form-group">
                        <label for="StartDate">Start Date:</label>
                        <input type="date" id="StartDate" name="StartDate" required>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h3>Employee Information</h3>
                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="EmployeeName">Full Name:</label>
                        <input type="text" id="EmployeeName" name="EmployeeName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="EmployeeAddress">Address:</label>
                        <input type="text" id="EmployeeAddress" name="EmployeeAddress" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="EmployeePhone">Phone:</label>
                        <input type="tel" id="EmployeePhone" name="EmployeePhone" required>
                    </div>
                    <div class="form-group">
                        <label for="EmployeeEmail">Email:</label>
                        <input type="email" id="EmployeeEmail" name="EmployeeEmail" required>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h3>Position Details</h3>
                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="PositionTitle">Position Title:</label>
                        <input type="text" id="PositionTitle" name="PositionTitle" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="PayRate">Pay Rate (per hour):</label>
                        <input type="text" id="PayRate" name="PayRate" placeholder="$XX.XX" required>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h3>Emergency Contact</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="EmergencyContactName">Emergency Contact Name:</label>
                        <input type="text" id="EmergencyContactName" name="EmergencyContactName" required>
                    </div>
                    <div class="form-group">
                        <label for="EmergencyContactPhone">Emergency Contact Phone:</label>
                        <input type="tel" id="EmergencyContactPhone" name="EmergencyContactPhone" required>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h3>Payroll Information</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="EmployeeTFN">Tax File Number (TFN):</label>
                        <input type="text" id="EmployeeTFN" name="EmployeeTFN" required>
                    </div>
                    <div class="form-group">
                        <label for="SuperFundName">Superannuation Fund Name:</label>
                        <input type="text" id="SuperFundName" name="SuperFundName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="EmployeeBSB">Bank BSB:</label>
                        <input type="text" id="EmployeeBSB" name="EmployeeBSB" pattern="[0-9]{3}-[0-9]{3}" placeholder="XXX-XXX" required>
                    </div>
                    <div class="form-group">
                        <label for="EmployeeAccountNumber">Bank Account Number:</label>
                        <input type="text" id="EmployeeAccountNumber" name="EmployeeAccountNumber" required>
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Generate Contract</button>
                <button type="reset" class="btn-secondary">Clear Form</button>
            </div>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
